description: A 1000 kW open-skid Mitsubishi diesel generator delivering 1100 kW standby at 400/230 V and 1800 A, with 197 g/kWh fuel consumption, for data centers, plants and prime power sites that need a full megawatt without a new switchgear room.
features:
