name: Cummins 400kW Open Diesel Generator
image: /images/products/cummins-400kw-open.jpg
brand: Cummins
powerKVA: 500
type: open
description: Heavy-duty 500kVA open-type diesel generator set with Cummins engine, built for continuous industrial and commercial power.
features:
  - Cummins NT-series engine, globally recognized reliability
  - Suitable for prime and standby duty cycles
  - Parallel operation and remote monitoring ready
  - Heavy-duty baseframe with anti-vibration mounts
